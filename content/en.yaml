# English content for johnny.com.mx
#
# es.yaml must keep the SAME structure: same keys, same number of list items,
# same order. Names, dates and URLs are duplicated in both files on purpose,
# so change them in both.
#
# Editing tips
#   - Quote a value ("...") if it starts with [ { > | * & ! % @ ` or contains ": " or " #".
#   - Dates: months are YYYY-MM, days are YYYY-MM-DD.
#   - Leave a URL empty ("") to hide that link; "#" shows it as "soon", not as a link.
#   - Colors and section numbers are assigned automatically.
#   - Run `python3 tools/check_content.py` before uploading.

