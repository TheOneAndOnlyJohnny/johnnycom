experience:                          # newest first (companies, and roles inside each); leave `to` empty for the current role
  - company: Capital One
    color: '#d03027'  # brand color: '#rrggbb' (quoted) or a Catppuccin name like yellow, which follows the theme
    roles:
      - role: Sr. Engineering Manager
        from: 2024-05
        to:
        bullets:
          - As a Sr Manager of Software Engineering at Capital One, I lead teams of highly talented engineers who build and deliver cloud-native web applications using GoLang, Java, Angular, C#, NodeJs and AWS.

  - company: Nimble Gravity
    color: '#2e1a47'
    roles:
      - role: Engineering Manager
        from: 2022-08
        to: 2023-12
        bullets:
          - Career Development, implementing career ladders for disciplines present in the company, syncing and aligning with customers to make sure everything lines up and there’s as least impact as possible.
          - Coaching of other Jr Engineering Managers, holding weekly 1:1s with them, helping them improve communication, conflict resolution skills, management skills and helping them implement frameworks where needed.

  - company: Shopify
    color: '#95bf47'
    roles:
      - role: Engineering Program Manager
        from: 2021-11
        to: 2022-07
        bullets:
          - Responsible of different programs and initiatives, part of the daily tasks are assess and identify risks, plan for contingencies, assist in budget allocation, tracking, align involved groups some times from different business units

  - company: Wizeline
    color: '#e93d44'
    roles:
      - role: Sr. Engineering Manager / Lead of Software Engineering Discipline
        from: 2020-01
        to: 2021-11
        bullets:
          - Responsible of hiring process, identifying and executing general hiring process changes, or per project based on needs, identifying and defining engineer’s role description, required skillset and adjusting hiring process to fit said skillset.
          - Helped with the redefinition of our career ladder, a tool that explains behavioral expectations for all engineers in all levels, where we focus not only on engineering mastery, but also in communication, entrepreneurial savviness, leadership skills and more.
          - Worked with an average of 43-52 direct reports at a time

      - role: Delivery Manager
        from: 2018-08
        to: 2019-12
        bullets:
          - Main responsibilities were to make sure the project was successful, in charge of scope and SOW validation, team composition, staffing, budget, team health and team dynamics.
          - Led in 11 projects with 9 different clients, got to finish 5 of them, 3 of which have a case study in Wizeline’s website (USC, Fitz Frames and TaxLab).
          - In charge of analyzing project requirements, choosing the appropriate team, and making sure the strategy is sound. Identify possible conflicts, blockers or detractors, and act swiftly to solve them or find workarounds.

      - role: Software Engineering Manager
        from: 2018-05
        to: 2018-08
        bullets:
          - Started managing 13 persons across 4 projects, while the duration was short, I managed to complete the first release of one of the projects.
          - Was completely hands-on in the USC project, helping out with map functionality, not only on the Javascript side, but also in the CAD to GIS migration.

  - company: Ooyala
    color: yellow
    roles:
      - role: Software Engineering Manager
        from: 2017-02
        to: 2018-05
        bullets:
          - Took over the team in charge of stream security in a critical state (50+ open tickets), within 2 months, managed to bring it down to 15 non-critical incidents.
          - Personally moved the Reseller portal from a server-based infrastructure, to a Docker instance, this saved almost $3,000 USD monthly, this to prove the value of moving away from a monolithic architecture and get the approval to decouple SAS (Stream Authorization System).
          - Designed the new architecture of the new SAS, which was 100% micro-services oriented and ready to integrate with not only with Ooyala Backlot, but also with Ooyala FLEX.

      - role: Senior Software Engineer
        from: 2015-10
        to: 2017-02
        bullets:
          - Technical lead of the internal tools team, was in charge of development and sustaining of new and existing tools.
          - Revamped Ooyala’s reseller portal, migrating it from a standalone application, to a docker instance, significantly improving performance and reducing cost.
          - Created a status dashboard, using Datadog, Jira and Salesforce data (alerts, tickets and customer reports) to identify failing systems and alert on possible upcoming problems.

