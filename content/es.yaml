  role: Senior Engineering Manager
  locationShort: CDMX, MX

hero:
  prompt:                            # solo la imagen para compartir (og-*.png): johnny@mx:~$ whoami
    user: johnny@mx
    command: whoami
  line: Senior Engineering Manager en Capital One. Formo equipos de ingeniería, y también cocino y sé algo de programación.
  ridgeTitle: Formo equipos de ingeniería increíbles.   # solo la imagen para compartir (og-*.png)
  cursorHint: MUEVE EL CURSOR

about:
  summary: Formo equipos de ingeniería increíbles… Con experiencia liderando equipos para crear soluciones innovadoras. Historial comprobado en gestión de proyectos y experiencia técnica, impulsando el crecimiento del equipo y entregando resultados exitosos. También cocino y sé algo de programación.
  facts:                             # etiqueta: valor (las etiquetas no pueden ser solo dígitos)
    vivo en: Ciudad de México, MX
    ahora: Capital One
    estudié: Ciencias de la Computación, UdeG
    hablo: Español · Inglés C1
    desde: "2009"

experience:                          # lo más reciente primero (empresas, y puestos dentro de cada una); deja `to` vacío en el puesto actual
  - company: Capital One
    color: '#d03027'  # color de marca: '#rrggbb' (entre comillas) o un nombre de Catppuccin como yellow, que sigue el tema
    roles:
      - role: Sr. Engineering Manager
        from: 2024-05
        to:
        bullets:
          - Como Sr Manager of Software Engineering en Capital One, lidero equipos de ingenieros muy talentosos que construyen y entregan aplicaciones web cloud-native con GoLang, Java, Angular, C#, NodeJs y AWS.

  - company: Nimble Gravity
    color: '#2e1a47'
    roles:
      - role: Engineering Manager
        from: 2022-08
        to: 2023-12
        bullets:
          - "Desarrollo profesional: implementé career ladders para las disciplinas de la empresa, sincronizando y alineando con clientes para que todo cuadrara con el menor impacto posible."
          - Coaching a otros Jr Engineering Managers con 1:1s semanales, ayudándoles a mejorar comunicación, resolución de conflictos y habilidades de gestión, e implementar frameworks donde hiciera falta.

  - company: Shopify
    color: '#95bf47'
    roles:
      - role: Engineering Program Manager
        from: 2021-11
        to: 2022-07
        bullets:
          - Responsable de distintos programas e iniciativas; el día a día incluía evaluar e identificar riesgos, planear contingencias, apoyar en asignación y seguimiento de presupuesto, y alinear a los grupos involucrados, a veces de distintas unidades de negocio.

  - company: Wizeline
    color: '#e93d44'
    roles:
      - role: Sr. Engineering Manager / Líder de la disciplina de Software Engineering
        from: 2020-01
        to: 2021-11
        bullets:
          - "Responsable del proceso de contratación: identificar y ejecutar cambios generales o por proyecto según las necesidades, definir la descripción del rol de ingeniería y el skillset requerido, y ajustar el proceso a ese skillset."
          - Ayudé a redefinir nuestro career ladder, una herramienta que explica las expectativas de comportamiento para ingenieros de todos los niveles, enfocada no solo en dominio técnico sino también en comunicación, visión emprendedora, liderazgo y más.
          - Trabajé con un promedio de 43 a 52 reportes directos a la vez.

      - role: Delivery Manager
        from: 2018-08
        to: 2019-12
        bullets:
          - "Mi responsabilidad principal era el éxito del proyecto: validación de alcance y SOW, composición del equipo, staffing, presupuesto, salud y dinámica del equipo."
          - Lideré 11 proyectos con 9 clientes distintos y terminé 5; 3 de ellos tienen caso de estudio en el sitio de Wizeline (USC, Fitz Frames y TaxLab).
          - A cargo de analizar requerimientos, elegir el equipo adecuado y asegurar que la estrategia fuera sólida. Identificar conflictos, bloqueos o detractores y actuar rápido para resolverlos o encontrar alternativas.

      - role: Software Engineering Manager
        from: 2018-05
        to: 2018-08
        bullets:
          - Empecé gestionando a 13 personas en 4 proyectos; aunque fue poco tiempo, logré completar el primer release de uno de ellos.
          - Totalmente hands-on en el proyecto de USC, ayudando con la funcionalidad de mapas, tanto en JavaScript como en la migración de CAD a GIS.

  - company: Ooyala
    color: yellow
    roles:
      - role: Software Engineering Manager
        from: 2017-02
        to: 2018-05
        bullets:
          - Tomé el equipo de seguridad de streams en estado crítico (50+ tickets abiertos) y en 2 meses lo bajé a 15 incidentes no críticos.
          - Migré personalmente el portal de Resellers de infraestructura en servidores a una instancia Docker, ahorrando casi $3,000 USD al mes, para demostrar el valor de dejar la arquitectura monolítica y obtener la aprobación para desacoplar SAS (Stream Authorization System).
          - Diseñé la nueva arquitectura de SAS, 100% orientada a microservicios y lista para integrarse no solo con Ooyala Backlot, sino también con Ooyala FLEX.

      - role: Senior Software Engineer
        from: 2015-10
        to: 2017-02
        bullets:
          - Líder técnico del equipo de herramientas internas, a cargo del desarrollo y mantenimiento de herramientas nuevas y existentes.
          - Renové el portal de resellers de Ooyala, migrándolo de una aplicación standalone a una instancia Docker, mejorando el rendimiento y reduciendo costos.
          - Creé un dashboard de estado con datos de Datadog, Jira y Salesforce (alertas, tickets y reportes de clientes) para identificar sistemas con fallas y anticipar problemas.

