# Contenido en español de johnny.com.mx
#
# Debe mantener la MISMA estructura que en.yaml: mismas claves, mismo número de
# elementos en cada lista, mismo orden. Nombres, fechas y URLs están duplicados
# a propósito, así que cámbialos en ambos archivos.
#
# Tips
#   - Usa comillas ("...") si el valor empieza con [ { > | * & ! % @ ` o contiene ": " o " #".
#   - Fechas: meses como AAAA-MM, días como AAAA-MM-DD.
#   - Deja una URL vacía ("") para ocultar ese enlace; "#" la muestra como "pronto", sin enlace.
#   - Colores y números de sección se asignan solos.
#   - Corre `python3 tools/check_content.py` antes de subir.

meta:
  title: Johnny · Juan Guzmán        # título de la pestaña
  lang: es
  # resultados de búsqueda y vistas previas, máximo 160 caracteres
  description: Juan “Johnny” Guzmán — Senior Engineering Manager en Capital One, Ciudad de México. Liderazgo de ingeniería, career ladders, contratación y apps cloud-native.

